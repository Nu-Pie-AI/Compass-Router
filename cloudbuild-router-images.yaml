steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/compass-510017/compass/router-api:latest", "-f", "apps/api/Dockerfile", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "us-central1-docker.pkg.dev/compass-510017/compass/router-api:latest"]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/compass-510017/compass/router-web:latest", "-f", "apps/web/Dockerfile", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "us-central1-docker.pkg.dev/compass-510017/compass/router-web:latest"]
images:
  - us-central1-docker.pkg.dev/compass-510017/compass/router-api:latest
  - us-central1-docker.pkg.dev/compass-510017/compass/router-web:latest
options:
  logging: CLOUD_LOGGING_ONLY
