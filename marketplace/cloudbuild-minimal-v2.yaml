steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/compass:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/compass:latest'
      - '-f'
      - 'dockerfile'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/compass:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/compass:latest'

  # Deploy to Cloud Run (minimal - only required secrets)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'compass'
      - '--image'
      - 'gcr.io/$PROJECT_ID/compass:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,NEXT_PUBLIC_APP_URL=https://compass.nu-pie.ai,NEXTAUTH_URL=https://compass.nu-pie.ai'
      # Runtime secrets used by auth, database, AI, and email notifications.
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,AZURE_AD_CLIENT_ID=AZURE_AD_CLIENT_ID:latest,AZURE_AD_CLIENT_SECRET=AZURE_AD_CLIENT_SECRET:latest,AZURE_AD_TENANT_ID=AZURE_AD_TENANT_ID:latest,RESEND_API_KEY=RESEND_API_KEY:latest,ADMIN_NOTIFICATION_EMAIL=ADMIN_NOTIFICATION_EMAIL:latest,EMAIL_FROM=EMAIL_FROM:latest'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'

substitutions:
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

images:
  - 'gcr.io/$PROJECT_ID/compass:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/compass:latest'
